<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Login — Preview</title>
<style>
	/* ---- public/css/smart-login.css (inlined for this standalone preview) ---- */
	.sml-card {
		--sml-bg: #ffffff;
		--sml-surface: #f7f7f8;
		--sml-fg: #111114;
		--sml-muted: #86868f;
		--sml-accent: #111114;
		--sml-accent-fg: #ffffff;
		--sml-border: #d8d8dc;
		--sml-radius: 0px;
		--sml-radius-sm: 0px;
		--sml-error: #d92d20;
		--sml-error-bg: #fef2f1;
		--sml-ok: #12805c;
		--sml-ok-bg: #edfbf5;

		max-width: 420px;
		margin: 0 auto;
		padding: 22px 20px;
		background: var(--sml-bg);
		color: var(--sml-fg);
		border: none;
		border-radius: var(--sml-radius);
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		-webkit-font-smoothing: antialiased;
		box-sizing: border-box;
	}

	@media ( prefers-color-scheme: dark ) {
		.sml-card {
			--sml-bg: #17171a;
			--sml-surface: #1f1f23;
			--sml-fg: #f5f5f6;
			--sml-muted: #94949c;
			--sml-accent: #f5f5f6;
			--sml-accent-fg: #17171a;
			--sml-border: #3a3a40;
			--sml-error-bg: rgba(217, 45, 32, 0.14);
			--sml-ok-bg: rgba(18, 128, 92, 0.16);
		}
	}

	.sml-card * {
		box-sizing: border-box;
	}

	.sml-heading {
		margin-bottom: 18px;
		text-align: center;
	}

	.sml-heading-line1 {
		font-size: 21px;
		font-weight: 700;
		letter-spacing: -0.01em;
		line-height: 1.25;
	}

	.sml-heading-line2 {
		font-size: 16px;
		font-weight: 400;
		color: var(--sml-fg);
		line-height: 1.3;
	}

	/* ---- Material floating-label boxed field (see smart-login.css for full comment) ---- */
	.sml-card .sml-field-boxed {
		position: relative !important;
		display: block !important;
		height: 44px !important;
		margin: 0 0 10px !important;
		padding: 0 !important;
		border: 1.5px solid var(--sml-border) !important;
		background: var(--sml-bg) !important;
		box-sizing: border-box !important;
		transition: border-color 0.15s ease !important;
	}

	.sml-card .sml-field-boxed:focus-within {
		border-color: var(--sml-fg) !important;
	}

	.sml-card .sml-field-boxed > input,
	.sml-card .sml-field-boxed > select,
	.sml-card .sml-field-boxed > .sml-password-group,
	.sml-card .sml-field-boxed > .sml-phone-group {
		display: block !important;
		position: absolute !important;
		left: 12px !important;
		right: 12px !important;
		top: auto !important;
		bottom: 6px !important;
		width: auto !important;
		height: 19px !important;
		margin: 0 !important;
		padding: 0 !important;
		font-size: 14px !important;
		line-height: 19px !important;
		font-family: inherit !important;
		color: var(--sml-fg) !important;
		background: transparent !important;
		border: none !important;
		border-radius: 0 !important;
		box-shadow: none !important;
	}

	.sml-card .sml-field-boxed > input:focus,
	.sml-card .sml-field-boxed > select:focus {
		outline: none !important;
		box-shadow: none !important;
	}

	.sml-card .sml-field-boxed label {
		display: block !important;
		position: absolute !important;
		left: 12px !important;
		right: 12px !important;
		top: 50% !important;
		transform: translateY(-50%) !important;
		margin: 0 !important;
		padding: 0 !important;
		border: none !important;
		box-shadow: none !important;
		outline: none !important;
		font-size: 14px !important;
		font-weight: 400 !important;
		text-transform: none !important;
		letter-spacing: normal !important;
		color: var(--sml-muted) !important;
		background: none !important;
		white-space: nowrap !important;
		overflow: hidden !important;
		text-overflow: ellipsis !important;
		pointer-events: none !important;
		z-index: 1 !important;
		transition: top 0.15s ease, font-size 0.15s ease, font-weight 0.15s ease,
			letter-spacing 0.15s ease, text-transform 0.15s ease !important;
	}

	.sml-card .sml-field-boxed:focus-within label,
	.sml-card .sml-field-boxed:has(input:not(:placeholder-shown)) label,
	.sml-card .sml-field-boxed:has(select) label {
		top: 7px !important;
		transform: translateY(0) !important;
		font-size: 10px !important;
		font-weight: 600 !important;
		text-transform: uppercase !important;
		letter-spacing: 0.06em !important;
		color: var(--sml-muted) !important;
	}

	.sml-required {
		color: var(--sml-muted);
	}

	.sml-forgot-link {
		display: block;
		margin: 0 0 14px;
		font-size: 12.5px;
		color: var(--sml-fg);
		text-decoration: none;
	}

	.sml-forgot-link:hover {
		text-decoration: underline;
	}

	.sml-field-row {
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 10px;
	}

	.sml-field-row .sml-field-boxed {
		margin-bottom: 10px;
	}

	@media (max-width: 360px) {
		.sml-field-row {
			grid-template-columns: 1fr;
			gap: 0;
		}
	}

	.sml-card .sml-phone-group {
		display: flex !important;
		align-items: center !important;
		gap: 8px !important;
		height: 100% !important;
	}

	.sml-card .sml-phone-group select {
		flex: 0 0 auto !important;
		width: auto !important;
		max-width: 74px !important;
		height: 100% !important;
		padding: 0 !important;
		font-size: 15px !important;
		color: var(--sml-fg) !important;
		background: transparent !important;
		border: none !important;
	}

	.sml-card .sml-phone-group input {
		flex: 1 !important;
		min-width: 0 !important;
		height: 100% !important;
		margin: 0 !important;
		padding: 0 !important;
		font-size: 14px !important;
		font-family: inherit !important;
		color: var(--sml-fg) !important;
		background: transparent !important;
		border: none !important;
		border-radius: 0 !important;
		box-shadow: none !important;
		outline: none !important;
	}

	.sml-card .sml-password-group {
		display: flex !important;
		align-items: center !important;
		height: 100% !important;
	}

	.sml-card .sml-password-group input {
		flex: 1 !important;
		min-width: 0 !important;
		height: 100% !important;
		margin: 0 !important;
		padding: 0 40px 0 0 !important;
		font-size: 14px !important;
		font-family: inherit !important;
		color: var(--sml-fg) !important;
		background: transparent !important;
		border: none !important;
		border-radius: 0 !important;
		box-shadow: none !important;
		outline: none !important;
	}

	.sml-card .sml-password-toggle {
		position: absolute !important;
		top: 50% !important;
		right: 0 !important;
		transform: translateY(-50%) !important;
		margin: 0 !important;
		padding: 0 !important;
		background: none !important;
		border: none !important;
		color: var(--sml-muted) !important;
		font-family: inherit !important;
		font-size: 11px !important;
		font-weight: 600 !important;
		cursor: pointer !important;
	}

	.sml-card .sml-password-toggle:hover {
		color: var(--sml-fg) !important;
	}

	.sml-otp {
		display: flex;
		gap: 8px;
		margin-bottom: 24px;
	}

	.sml-otp-box {
		flex: 1;
		min-width: 0;
		aspect-ratio: 1;
		padding: 0;
		font-family: inherit;
		font-size: 20px;
		font-weight: 700;
		text-align: center;
		color: var(--sml-fg);
		background: var(--sml-surface);
		border: 1.5px solid var(--sml-border);
		border-radius: var(--sml-radius-sm);
		transition: border-color 0.15s ease, box-shadow 0.15s ease;
	}

	.sml-otp-box:focus {
		outline: none;
		border-color: var(--sml-accent);
		box-shadow: 0 0 0 3px color-mix(in srgb, var(--sml-accent) 25%, transparent);
	}

	.sml-hp-field {
		position: absolute !important;
		left: -9999px !important;
		width: 1px;
		height: 1px;
		overflow: hidden;
	}

	.sml-btn {
		display: block;
		width: 100%;
		padding: 10px 14px;
		font-size: 14px;
		font-family: inherit;
		font-weight: 600;
		letter-spacing: -0.01em;
		text-align: center;
		text-decoration: none;
		border-radius: var(--sml-radius-sm);
		border: 1.5px solid transparent;
		cursor: pointer;
		box-sizing: border-box;
		transition: opacity 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
	}

	.sml-btn:hover:not(:disabled) {
		transform: translateY(-2px);
		box-shadow: 0 8px 16px -8px rgba(17, 17, 20, 0.35);
	}

	.sml-btn:active {
		transform: translateY(0) scale(0.99);
		box-shadow: none;
	}

	.sml-btn--primary {
		background: var(--sml-accent);
		color: var(--sml-accent-fg);
	}

	.sml-btn--primary:hover:not(:disabled) {
		opacity: 0.88;
	}

	.sml-btn--primary:disabled {
		opacity: 0.45;
		cursor: default;
		transform: none;
		box-shadow: none;
	}

	.sml-btn--secondary {
		margin-top: 10px;
		background: transparent;
		color: var(--sml-fg);
		border-color: var(--sml-border);
	}

	.sml-btn--secondary:hover:not(:disabled) {
		background: var(--sml-surface);
	}

	.sml-link-btn {
		background: none;
		border: none;
		padding: 0;
		color: var(--sml-fg);
		font-family: inherit;
		font-size: 13px;
		font-weight: 600;
		cursor: pointer;
		text-decoration: underline;
		text-underline-offset: 2px;
	}

	.sml-link-btn:disabled {
		color: var(--sml-muted);
		text-decoration: none;
		cursor: default;
	}

	.sml-resend-link {
		margin: 14px 0 0;
		text-align: center;
	}

	.sml-message,
	.sml-notice {
		margin-bottom: 20px;
		padding: 11px 13px;
		border-radius: var(--sml-radius-sm);
		font-size: 13px;
		font-weight: 500;
		line-height: 1.4;
	}

	.sml-message--error,
	.sml-notice--error {
		background: var(--sml-error-bg);
		color: var(--sml-error);
	}

	.sml-message--ok,
	.sml-notice--ok {
		background: var(--sml-ok-bg);
		color: var(--sml-ok);
	}

	.sml-verify-intro {
		margin: 0 0 20px;
		font-size: 13.5px;
		line-height: 1.5;
		color: var(--sml-muted);
	}

	body {
		margin: 0;
		min-height: 100vh;
		display: flex;
		align-items: flex-start;
		justify-content: center;
		gap: 56px;
		flex-wrap: wrap;
		padding: 64px 20px;
		background: #fafafa;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
	}
	.sml-preview-label {
		text-align: center;
		font-size: 11px;
		font-weight: 700;
		text-transform: uppercase;
		letter-spacing: .06em;
		color: #9a9aa2;
		margin-bottom: 14px;
	}
	.sml-preview-col {
		width: 380px;
	}
	/* Simulates a hostile theme trying to override the plugin — proves the !important rules win. */
	.hostile-theme input, .hostile-theme select, .hostile-theme label {
		border: 3px dashed red !important;
		font-size: 22px !important;
		text-transform: lowercase !important;
		position: static !important;
	}
</style>
</head>
<body>

<div class="sml-preview-col">
	<div class="sml-preview-label">/login</div>
	<div class="sml-card" data-sml-root>
		<div class="sml-message" data-sml-message hidden></div>

		<div class="sml-panel" data-sml-panel="login">
			<div class="sml-heading">
				<div class="sml-heading-line1">Log In</div>
				<div class="sml-heading-line2">to your account</div>
			</div>
			<form data-sml-form="login" novalidate>
				<div class="sml-field-boxed">
					<input type="email" id="sml-login-user" name="username" autocomplete="username" placeholder=" " required>
					<label for="sml-login-user">Email</label>
				</div>
				<div class="sml-field-boxed">
					<div class="sml-password-group">
						<input type="password" id="sml-login-pass" name="password" autocomplete="current-password" placeholder=" " required>
						<button type="button" class="sml-password-toggle" data-sml-password-toggle>Show</button>
					</div>
					<label for="sml-login-pass">Password</label>
				</div>
				<a class="sml-forgot-link" href="#">Forgot password?</a>
				<button type="submit" class="sml-btn sml-btn--primary">Log In</button>
				<p class="sml-resend-link" data-sml-resend-prompt hidden>
					<button type="button" class="sml-link-btn" data-sml-resend-from-login>Resend verification email</button>
				</p>
				<a class="sml-btn sml-btn--secondary" data-sml-tab="register" href="?action=register">Create Account</a>
			</form>
		</div>

		<div class="sml-panel" data-sml-panel="register" hidden>
			<div class="sml-heading">
				<div class="sml-heading-line1">Create Your</div>
				<div class="sml-heading-line2">Account</div>
			</div>
			<form data-sml-form="register" novalidate>
				<div class="sml-field-row">
					<div class="sml-field-boxed">
						<input type="text" id="sml-reg-first" name="first_name" autocomplete="given-name" placeholder=" " required>
						<label for="sml-reg-first">First name <span class="sml-required">*</span></label>
					</div>
					<div class="sml-field-boxed">
						<input type="text" id="sml-reg-last" name="last_name" autocomplete="family-name" placeholder=" " required>
						<label for="sml-reg-last">Last name <span class="sml-required">*</span></label>
					</div>
				</div>
				<div class="sml-field-boxed">
					<input type="email" id="sml-reg-email" name="email" autocomplete="email" placeholder=" " required>
					<label for="sml-reg-email">Email <span class="sml-required">*</span></label>
				</div>
				<div class="sml-field-boxed">
					<div class="sml-phone-group">
						<select id="sml-reg-phone-country" aria-label="Country code">
							<option title="United States/Canada">🇺🇸 +1</option>
							<option title="United Kingdom">🇬🇧 +44</option>
							<option title="UAE">🇦🇪 +971</option>
							<option title="Saudi Arabia">🇸🇦 +966</option>
							<option title="Iran">🇮🇷 +98</option>
							<option title="Türkiye">🇹🇷 +90</option>
							<option title="India">🇮🇳 +91</option>
						</select>
						<input type="tel" id="sml-reg-phone" name="phone_number" autocomplete="tel-national" inputmode="numeric" placeholder="555 123 4567" required>
					</div>
					<label for="sml-reg-phone">Mobile number <span class="sml-required">*</span></label>
				</div>
				<div class="sml-field-boxed">
					<div class="sml-password-group">
						<input type="password" id="sml-reg-pass" name="password" autocomplete="new-password" placeholder=" " required>
						<button type="button" class="sml-password-toggle" data-sml-password-toggle>Show</button>
					</div>
					<label for="sml-reg-pass">Password <span class="sml-required">*</span></label>
				</div>
				<button type="submit" class="sml-btn sml-btn--primary">Create Account</button>
				<a class="sml-btn sml-btn--secondary" data-sml-tab="login" href="?">Log In</a>
			</form>
		</div>
	</div>
</div>

<div class="sml-preview-col hostile-theme">
	<div class="sml-preview-label">Same card, under a hostile theme's CSS</div>
	<div class="sml-card" data-sml-root>
		<div class="sml-panel" data-sml-panel="login">
			<div class="sml-heading">
				<div class="sml-heading-line1">Log In</div>
				<div class="sml-heading-line2">to your account</div>
			</div>
			<form data-sml-form="login" novalidate>
				<div class="sml-field-boxed">
					<input type="email" id="sml-login-user2" name="username" autocomplete="username" placeholder=" " value="jane@example.com">
					<label for="sml-login-user2">Email</label>
				</div>
				<div class="sml-field-boxed">
					<div class="sml-password-group">
						<input type="password" id="sml-login-pass2" name="password" autocomplete="current-password" placeholder=" ">
						<button type="button" class="sml-password-toggle" data-sml-password-toggle>Show</button>
					</div>
					<label for="sml-login-pass2">Password</label>
				</div>
				<button type="submit" class="sml-btn sml-btn--primary">Log In</button>
			</form>
		</div>
	</div>
</div>

<div class="sml-preview-col">
	<div class="sml-preview-label">Verify-code step</div>
	<div class="sml-card" data-sml-root>
		<div class="sml-panel" data-sml-panel="verify">
			<p class="sml-verify-intro">We sent a verification code to your email. Enter it below, or click the link in the email.</p>
			<form data-sml-form="verify" novalidate>
				<div class="sml-otp" data-sml-otp role="group" aria-label="Verification code">
					<input type="text" class="sml-otp-box" inputmode="numeric" maxlength="1" value="2">
					<input type="text" class="sml-otp-box" inputmode="numeric" maxlength="1" value="7">
					<input type="text" class="sml-otp-box" inputmode="numeric" maxlength="1" value="4">
					<input type="text" class="sml-otp-box" inputmode="numeric" maxlength="1" value="5">
					<input type="text" class="sml-otp-box" inputmode="numeric" maxlength="1" value="">
					<input type="text" class="sml-otp-box" inputmode="numeric" maxlength="1" value="">
				</div>
				<button type="submit" class="sml-btn sml-btn--primary">Verify</button>
				<p class="sml-resend-link">
					<button type="button" class="sml-link-btn" data-sml-resend disabled>Resend in 1:47</button>
				</p>
			</form>
		</div>
	</div>
</div>

<script>
	// Local tab-switching, password-toggle, and OTP-box behaviour only, for
	// the static preview — the plugin's real public/js/smart-login.js
	// handles AJAX submission against WordPress and keeps the URL
	// (?action=register / no action) in sync via pushState.
	document.querySelectorAll( '[data-sml-tab]' ).forEach( function ( tab ) {
		tab.addEventListener( 'click', function ( e ) {
			e.preventDefault();
			var root = tab.closest( '[data-sml-root]' );
			root.querySelectorAll( '[data-sml-panel]' ).forEach( function ( p ) {
				p.hidden = p.getAttribute( 'data-sml-panel' ) !== tab.getAttribute( 'data-sml-tab' );
			} );
		} );
	} );

	document.querySelectorAll( '[data-sml-password-toggle]' ).forEach( function ( toggle ) {
		toggle.addEventListener( 'click', function () {
			var input = toggle.previousElementSibling;
			var isHidden = input.type === 'password';
			input.type = isHidden ? 'text' : 'password';
			toggle.textContent = isHidden ? 'Hide' : 'Show';
		} );
	} );

	document.querySelectorAll( '[data-sml-otp]' ).forEach( function ( group ) {
		var boxes = Array.prototype.slice.call( group.querySelectorAll( '.sml-otp-box' ) );
		boxes.forEach( function ( box, i ) {
			box.addEventListener( 'input', function () {
				box.value = box.value.replace( /[^0-9]/g, '' ).slice( -1 );
				if ( box.value && boxes[ i + 1 ] ) { boxes[ i + 1 ].focus(); }
			} );
			box.addEventListener( 'keydown', function ( e ) {
				if ( e.key === 'Backspace' && ! box.value && boxes[ i - 1 ] ) { boxes[ i - 1 ].focus(); }
			} );
			box.addEventListener( 'paste', function ( e ) {
				e.preventDefault();
				var text = ( e.clipboardData || window.clipboardData ).getData( 'text' ).replace( /[^0-9]/g, '' );
				text.split( '' ).forEach( function ( digit, idx ) {
					if ( boxes[ idx ] ) { boxes[ idx ].value = digit; }
				} );
				var next = boxes[ Math.min( text.length, boxes.length - 1 ) ];
				if ( next ) { next.focus(); }
			} );
		} );
	} );
</script>

</body>
</html>
